services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - jobs:/app/storage
      - ./ai_engine:/models:ro
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    env_file: ./backend/.env
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  jobs:
